<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lyrics</title>
<style>
@font-face{font-family:BeautifulLyrics;font-weight:400;src:url(https://fonts.socalifornian.live/LyricsRegular.woff2)}
@font-face{font-family:BeautifulLyrics;font-weight:500;src:url(https://fonts.socalifornian.live/LyricsMedium.woff2)}
@font-face{font-family:BeautifulLyrics;font-weight:600;src:url(https://fonts.socalifornian.live/LyricsSemibold.woff2)}
@font-face{font-family:BeautifulLyrics;font-weight:700;src:url(https://fonts.socalifornian.live/LyricsBold.woff2)}
:root{color-scheme:dark;--W:calc(min(30vw,50vh)*1.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}*{box-sizing:border-box}
body{height:100%;margin:0;background:#000;color:#fff;font:500 15px/1.3 BeautifulLyrics,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#panel{position:absolute;left:calc(50vw - var(--W)*1.25);top:0;width:var(--W);height:100vh;padding-top:calc(50vh - var(--W)*.6);container-type:size;font-family:BeautifulLyrics,"Helvetica Neue",Arial,sans-serif}
#media{width:100cqw;height:100cqw;margin-bottom:4cqw;position:relative;container-type:size}
#art{position:absolute;top:0;left:0;width:100cqh;height:100cqh;object-fit:cover;border-radius:1.7vh;opacity:.95;box-shadow:#00000045 0 9px 20px 0;background:#222;transition:filter .25s}
#media.ControlsVisible #art{filter:brightness(.5) opacity(.75)}
#controls{display:none;width:100cqw;height:7.5cqh;padding-left:1.5cqw;position:absolute;bottom:10cqh;gap:3.5cqw;justify-content:center;align-items:center;z-index:3;container-type:size;opacity:.85}
#volume{--Width:84cqw;display:none;width:var(--Width);height:1.5cqh;position:absolute;bottom:2cqh;left:calc((100cqw - var(--Width))/2);margin-bottom:1.75cqh;justify-content:center;align-items:center;z-index:3;container-type:size;opacity:.85}
#media.ControlsVisible #controls,#media.ControlsVisible #volume{display:flex}
#controls:hover .PlaybackControl:not(:hover){opacity:.5!important}
.PlaybackControl{display:flex;aspect-ratio:1;fill:#fff;align-items:center;justify-content:center;cursor:pointer;transition:opacity .175s cubic-bezier(.37,0,.63,1);--ShrinkScale:.9;--ShrinkDelta:calc(1 - var(--ShrinkScale))}
.PlaybackControl:hover{opacity:1!important}
.PlaybackControl:not(.Pressed){animation:Depress .6s forwards}
.PlaybackControl.Pressed{transform:scale(var(--ShrinkScale))}
@keyframes Depress{0%{transform:scale(calc(1 - var(--ShrinkDelta)))}16%{transform:scale(calc(1 + var(--ShrinkDelta)*.32))}28%{transform:scale(calc(1 - var(--ShrinkDelta)*.13))}44%{transform:scale(calc(1 + var(--ShrinkDelta)*.05))}59%{transform:scale(calc(1 - var(--ShrinkDelta)*.02))}73%{transform:scale(calc(1 + var(--ShrinkDelta)*.01))}100%{transform:scale(1)}}
.Shuffle{height:100cqh;opacity:.75;margin-bottom:-4.75cqh;margin-right:-.35cqw}.Shuffle svg{height:44cqh}
.LastTrack{rotate:180deg}.SkipTrack{height:125cqh;opacity:.95}.SkipTrack svg{height:90cqh;aspect-ratio:1}
.TogglePlayState{height:150cqh;margin-right:-.75cqw}.TogglePlayState svg{height:100cqh}.TogglePlayState .Pause{margin-left:-1cqw}
.ToggleLoopState{height:100cqh;opacity:.725;margin-left:-.575cqw;margin-bottom:-4.5cqh}.ToggleLoopState svg{height:47cqh}
.Shuffle.Enabled,.ToggleLoopState.Enabled{filter:brightness(2.75)}.Shuffle.Enabled svg,.ToggleLoopState.Enabled svg{filter:drop-shadow(0 0 5px #fff)}
.VolumeLevels{height:250cqh;aspect-ratio:1;fill:rgb(255 255 255/90%);margin-right:1.5cqw}
.Level{transition:opacity .1s linear}.Level.Hidden{opacity:0}
.SliderBar{--p:0;width:auto;flex-grow:1;border-radius:100cqw;background:linear-gradient(90deg,rgb(255 255 255/90%) 0,rgb(255 255 255/90%) calc(100%*var(--p)),rgb(255 255 255/38%) calc(100%*var(--p)),rgb(255 255 255/38%));position:relative;container-type:size}
#volume .SliderBar{height:75cqh}
.Hitbox{cursor:pointer;--ex:200cqh;display:block;width:calc(100cqw + var(--ex));height:calc(100cqh + var(--ex));position:absolute;top:calc(var(--ex)*-.5);left:calc(var(--ex)*-.5);z-index:1;touch-action:none}
.Handle{display:block;height:185cqh;aspect-ratio:1;border-radius:100cqw;background:#fff;position:absolute;top:54cqh;left:calc(100cqw*var(--p));transform:translate(-50%,-50%)}
.Timeline{display:flex;opacity:.85;width:100cqw;padding-right:.25cqw;justify-content:center;align-items:center;margin-bottom:1.75cqh;position:relative}
.Timeline .SliderBar{height:.65cqh}
.Position,.Length{font-size:2cqh;color:#ffffffb5;font-weight:500;font-variant-numeric:tabular-nums}
.Position{padding-right:1.5cqw}.Length{padding-left:1.5cqw}
.TrackDetails{display:flex;width:100cqw;height:17.5cqw;flex-direction:column;container-type:size}
.Title{--h:35cqh;display:flex;justify-content:center;color:rgb(255 255 255/85%);font-size:var(--h);line-height:var(--h);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.Title span{overflow:hidden;text-overflow:ellipsis}
.Release{--h:30cqh;--f:calc(var(--h)*.85);display:flex;width:100cqw;color:rgb(241 241 241/60%);font-size:var(--f);line-height:var(--h);margin-top:1.5cqw;justify-content:center;align-items:center;white-space:nowrap;overflow:hidden}
.Sep{display:inline-block;background:rgb(234 234 234/28%);height:calc(var(--h)*.125);width:calc(var(--h)*.25);border-radius:100cqh;margin-left:7.5cqh;margin-right:6.5cqh}
#artists{max-width:86cqw;color:rgb(255 255 255/39%);overflow:hidden;text-overflow:ellipsis}#artists b{font-weight:inherit;color:rgb(255 255 255/68%)}
#vp{position:absolute;left:calc(50vw - var(--W)*.075);top:0;width:calc(37.5vw + var(--W)*.3875);height:100vh;overflow:hidden;container-type:size}
#list{position:absolute;left:0;top:0;width:100cqw;padding-left:1cqw;font-size:clamp(1.85rem,7cqw,3.5rem);transition:transform .55s cubic-bezier(.37,0,.63,1);will-change:transform}
.g{all:unset;display:flex;flex-direction:column;margin:1cqw 0;line-height:1.1818;cursor:pointer;width:100%}
.v{display:flex;flex-wrap:wrap;width:95cqw;font-weight:700;opacity:.51;transition:opacity .25s cubic-bezier(.61,1,.88,1)}
.v.Sung{opacity:.497}.v.Active{opacity:1}
.ln{display:flex;position:relative;white-space:pre-wrap;transform-origin:left center;--a:.4;color:rgba(255,255,255,var(--a));filter:blur(var(--b,0px));margin:-.5px -.75px;padding:.5px .75px;transition:scale .1s cubic-bezier(.37,0,.63,1)}
.v.Sung .ln{--a:.85}
.v.Active .ln{scale:1.05;filter:none;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;background-image:linear-gradient(180deg,rgba(255,255,255,.85) var(--p,0%),rgba(255,255,255,.4) calc(var(--p,0%) + 20%));text-shadow:0 0 var(--gb,4px) rgba(255,255,255,var(--go,0))}
.g:hover .v{opacity:1}.g:hover .ln{filter:none}
.Interlude{display:none;width:fit-content;--gap:clamp(.3rem,1.7cqw,.8rem);grid-template-columns:repeat(3,calc(var(--gap)*1.75));column-gap:var(--gap);margin:1cqw 0 1cqw calc(var(--gap)*1.1)}
.Interlude.Active{display:grid}
.Dot{width:calc(2*var(--gap));height:calc(2*var(--gap));border-radius:100rem;background:rgba(255,255,255,.85);will-change:transform}
.plain #vp{overflow-y:auto}.plain #list{position:static}.plain .v{opacity:1}.plain .ln{--a:1;filter:none}.plain .g{cursor:default}
#msg{position:absolute;left:0;top:0;width:100%;height:100%;display:none;align-items:center;padding-left:1cqw;font-size:clamp(1.85rem,7cqw,3.5rem);font-weight:700;opacity:.51}
#start{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:rgba(0,0,0,.8);padding:20px}
#start div{max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
#start input{all:unset;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.1);font-size:14px}
#start button{padding:13px;border-radius:99px;background:#fff;color:#000;font-weight:600;opacity:1;text-align:center}
#start small{opacity:.6;font-size:12px;word-break:break-all}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 20px);transform:translate(-50%,-10px);opacity:0;padding:10px 18px;border-radius:99px;background:rgba(0,0,0,.7);font-size:13px;transition:.4s;pointer-events:none;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:860px){body{overflow:auto;height:auto;min-height:100%}#panel{position:static;width:min(80vw,380px);height:auto;margin:0 auto;padding-top:24px;container-type:inline-size}#vp{position:relative;left:0;width:100%;height:70vh}}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<section id="panel">
  <div id="media">
    <div id="controls">
      <div class="PlaybackControl Shuffle" id="shuf" role="button" tabindex="0" aria-label="Shuffle"></div>
      <div class="PlaybackControl SkipTrack LastTrack" id="prev" role="button" tabindex="0" aria-label="Previous"></div>
      <div class="PlaybackControl TogglePlayState" id="pp" role="button" tabindex="0" aria-label="Play or pause"></div>
      <div class="PlaybackControl SkipTrack NextTrack" id="next" role="button" tabindex="0" aria-label="Next"></div>
      <div class="PlaybackControl ToggleLoopState" id="loop" role="button" tabindex="0" aria-label="Repeat"></div>
    </div>
    <div id="volume"><div class="SliderBar" id="vbar"><div class="Hitbox"></div><div class="Handle"></div></div></div>
    <img id="art" alt="">
  </div>
  <div class="Timeline"><span class="Position" id="cur">0:00</span><div class="SliderBar" id="bar"><div class="Hitbox"></div><div class="Handle"></div></div><span class="Length" id="tot">0:00</span></div>
  <div class="TrackDetails"><div class="Title"><span id="title"></span></div><div class="Release"><span id="date"></span><span class="Sep"></span><span id="artists"></span></div></div>
</section>
<section id="vp"><div id="list"></div><div id="msg"></div></section>
<div id="start"><div>
  <input type="text" id="cid" placeholder="Spotify Client ID" aria-label="Spotify Client ID">
  <button id="login">Connect Spotify</button>
  <small id="ruri"></small>
</div></div>
<div id="toast"></div>

function parseLRC(t) {

    const s = row.replace(/\[[^\]]*\]/g, "").trim();
    tags.forEach(m => out.push({ t: (+m[1] * 60 + +m[2]) * 1000, s }));
  }
  out.sort((a, b) => a.t - b.t);
  if (out.length && out[0].t >= 2000) out.unshift({ t: 0, s: "" });
  return out;
}

  const L = "https://lrclib.net/api/";
  const d = await j(L + "get?" + new URLSearchParams({ track_name: t.title, artist_name: first, album_name: t.album, duration: Math.round(sec) }));
  if (d && (d.syncedLyrics || d.plainLyrics)) return d;
  const clean = t.title.replace(/\s*[\(\[].*$/, "").replace(/\s+-\s+.*$/, "").trim();
  const r0 = await j(L + "search?" + new URLSearchParams({ track_name: clean, artist_name: first })), res = Array.isArray(r0) ? r0 : [];
  const ok = res.filter(x => Math.abs(x.duration - sec) <= 6);
  return ok.find(x => x.syncedLyrics) || ok.concat(res).find(x => x.plainLyrics) || null;

  try { sessionStorage.setItem("v", v); } catch { return toast("Browser storage is unavailable"); }
  const ch = b64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v)));
  location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({ client_id: cid, response_type: "code", redirect_uri: RURI, scope: SCOPE, code_challenge_method: "S256", code_challenge: ch });
}
async function tokenReq(body) {
  const r = await fetch("https://accounts.spotify.com/api/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams({ client_id: store.get("cid"), ...body }) });
  if (!r.ok) throw new Error("auth"); const d = await r.json();
  const old = JSON.parse(store.get("tok") || "{}");
  store.set("tok", JSON.stringify({ a: d.access_token, r: d.refresh_token || old.r, e: Date.now() + d.expires_in * 1000 - 30000 }));
}
async function token() {
  const t = JSON.parse(store.get("tok") || "null"); if (!t) throw new Error("auth");
  if (Date.now() > t.e) await tokenReq({ grant_type: "refresh_token", refresh_token: t.r });
  return JSON.parse(store.get("tok")).a;
}
async function sp(path, o = {}, retry = true) {
  try {
    const r = await fetch("https://api.spotify.com/v1" + path, { ...o, headers: { Authorization: "Bearer " + await token() } });
    if (r.status === 204 || r.status === 202) return null;
    if (r.status === 401 && retry) { const t = JSON.parse(store.get("tok")); t.e = 0; store.set("tok", JSON.stringify(t)); return sp(path, o, false); }
    if (r.status === 403) { toast("Playback controls need Spotify Premium"); return null; }
    if (r.status === 404) { toast("No active Spotify device found"); return null; }
    if (r.status === 429) { toast("Spotify is rate limiting requests"); return null; }
    if (!r.ok) throw new Error(r.status);
    return r.headers.get("content-type")?.includes("json") ? r.json() : null;
  } catch (e) {
    if (e.message === "auth") { store.set("tok", ""); $("#start").style.display = "grid"; toast("Session expired. Please reconnect."); }
    else toast("Couldn’t reach Spotify. Retrying…");
    return null;
  }
}
async function poll1() {
  const d = await sp("/me/player");
  if (!d || !d.item) { if (S.id) { S.id = null; S.lines = []; $("#list").innerHTML = ""; setPos(0, false); } msg("Nothing playing"); return; }
  const it = d.item;
  if (!it.artists || !it.album) { if (S.id) { S.id = null; S.lines = []; $("#list").innerHTML = ""; } msg("Only songs are supported"); return; }
  const names = it.artists.map(a => a.name);
  if (it.id !== S.id) loadTrack({ id: it.id, title: it.name, artists: names, artist: names.join(", "), album: it.album.name, date: (it.album.release_date || "").slice(0, 4), dur: it.duration_ms, art: (it.album.images[0] || {}).url || "" });
  if (performance.now() > S.lock && (Math.abs(pos() - d.progress_ms) > 700 || d.is_playing !== S.playing)) setPos(d.progress_ms, d.is_playing);
  S.shuffle = d.shuffle_state; S.repeat = d.repeat_state; $("#shuf").classList.toggle("Enabled", !!S.shuffle); showLoop();
  if (d.device && d.device.volume_percent != null && !S.vdrag) showVol(d.device.volume_percent / 100);
}
async function pollLoop() { try { await poll1(); } catch (e) { console.error(e); } setTimeout(pollLoop, 2500); }
async function boot() {
  $("#ruri").textContent = "Redirect URI: " + RURI; $("#cid").value = store.get("cid") || "";
  $("#login").onclick = login;
  const code = new URLSearchParams(location.search).get("code");
  if (code) {
    try { await tokenReq({ grant_type: "authorization_code", code, redirect_uri: RURI, code_verifier: sessionStorage.getItem("v") }); }
    catch { toast("Spotify sign-in failed. Try again."); }
    history.replaceState({}, "", RURI);
  }
  if (store.get("tok")) { $("#start").style.display = "none"; msg("Nothing playing"); pollLoop(); }
  requestAnimationFrame(tick);
}
boot();
